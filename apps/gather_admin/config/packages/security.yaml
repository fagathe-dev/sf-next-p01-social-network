security:
    password_hashers:
        Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface:
            algorithm: argon2id

    role_hierarchy:
        ROLE_MODERATOR: [ROLE_USER]
        ROLE_ADMIN: [ROLE_MODERATOR]

    providers:
        app_user_provider:
            entity:
                class: Fagathe\GatherCore\Entity\User

    firewalls:
        dev:
            pattern: ^/(_profiler(/|$)|(_wdt|assets|build)/)
            security: false

        main:
            lazy: true
            provider: app_user_provider
            user_checker: Fagathe\GatherCore\Security\UserChecker
            form_login:
                login_path: admin_login
                check_path: admin_login
                default_target_path: admin_reports
                enable_csrf: true
                # Jeton de session : le double-submit « stateless » exigerait un script côté navigateur
                csrf_token_id: admin_login
            logout:
                path: admin_logout
                target: admin_login
                enable_csrf: true
                csrf_token_id: admin_logout

    # Tout le back-office est réservé au staff, sauf la page de connexion
    access_control:
        - { path: ^/login$, roles: PUBLIC_ACCESS }
        - { path: ^/sso(/start)?$, roles: PUBLIC_ACCESS }
        - { path: ^/, roles: ROLE_MODERATOR }

when@test:
    security:
        password_hashers:
            Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface:
                algorithm: argon2id
                time_cost: 3
                memory_cost: 10
