# yaml-language-server: $schema=../vendor/symfony/dependency-injection/Loader/schema/services.schema.json

parameters:

services:
    _defaults:
        autowire: true
        autoconfigure: true

    App\:
        resource: '../src/'

    # Les journaux applicatifs à consulter sont ceux de l'API (scraping OpenGraph, accès refusés, erreurs critiques)
    Fagathe\GatherCore\Service\LogViewerService:
        arguments:
            $logsDir: '%kernel.project_dir%/../gather_api/logs/'
