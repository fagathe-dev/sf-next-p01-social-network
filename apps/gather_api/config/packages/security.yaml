security:
    password_hashers:
        Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface:
            algorithm: argon2id

    role_hierarchy:
        ROLE_MODERATOR: [ROLE_USER]
        ROLE_ADMIN: [ROLE_MODERATOR]

    providers:
        # Pas de "property" : Doctrine délègue à UserRepository::loadUserByIdentifier() (e-mail OU username)
        app_user_provider:
            entity:
                class: Fagathe\GatherCore\Entity\User

    firewalls:
        dev:
            pattern: ^/(_profiler(/|$)|(_wdt|assets|build)/)
            security: false

        # Sans authentificateur JWT : un cookie expiré ne doit pas empêcher de se reconnecter ni de rafraîchir la session
        auth:
            pattern: ^/api/auth/
            stateless: true
            provider: app_user_provider
            user_checker: Fagathe\GatherCore\Security\UserChecker
            custom_authenticators:
                - Fagathe\GatherCore\Security\ApiAuthenticator

        api:
            pattern: ^/api
            stateless: true
            provider: app_user_provider
            user_checker: Fagathe\GatherCore\Security\UserChecker
            jwt: ~
            entry_point: jwt

    # Lecture publique (mode visiteur) : chaque action réservée porte #[IsGranted] sur son contrôleur
    access_control:
        - { path: ^/api/auth/, roles: PUBLIC_ACCESS }

when@test:
    security:
        password_hashers:
            Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface:
                algorithm: argon2id
                time_cost: 3
                memory_cost: 10
